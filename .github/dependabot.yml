# Weekly dependency updates. Minor/patch bumps are grouped into one PR per ecosystem;
# majors (Electron, React, Vite…) come separately so they can be tested on their own.
# cooldown: wait two weeks after a release before proposing it (supply-chain safety).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Types must match the Node major the app runs on (CI and Electron use Node 24).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # v9 is a rewrite (renamed core APIs, opt-in feature plugins); migrate the grid deliberately.
      - dependency-name: '@tanstack/react-table'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']
